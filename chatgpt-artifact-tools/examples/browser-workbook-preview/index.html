<!doctype html>
<html lang="en" data-codex-window-type="electron" data-window-type="electron" data-codex-os="darwin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portable Workbook Preview</title>
    <style>
      :root {
        color-scheme: light;
        --token-bg-primary: #ffffff;
        --token-bg-secondary: #f7f7f5;
        --token-main-surface-primary: #ffffff;
        --token-border: #d8d8d2;
        --token-border-light: #e8e8e3;
        --token-text-primary: #171713;
        --token-text-secondary: #55554e;
        --token-text-tertiary: #77776f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(37, 99, 235, 0.12), transparent 30rem),
          linear-gradient(135deg, #f7f5ed 0%, #e8ebdf 55%, #f8f8f4 100%);
        color: #171713;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        padding: 18px;
        gap: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid rgba(23, 23, 19, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 16px 50px rgba(28, 32, 20, 0.12);
        padding: 14px 16px;
        backdrop-filter: blur(18px);
      }

      .title {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .title strong {
        font-size: 15px;
        letter-spacing: 0.01em;
      }

      .title span,
      .status {
        color: #626259;
        font-size: 12px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button,
      label.file,
      select.fixture-picker {
        border: 1px solid rgba(23, 23, 19, 0.14);
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        padding: 8px 12px;
      }

      button,
      label.file {
        background: #171713;
        color: #fff;
      }

      button.secondary {
        background: #fff;
        color: #171713;
      }

      select.fixture-picker {
        max-width: 190px;
        background: #fff;
        color: #171713;
      }

      input[type="file"] {
        display: none;
      }

      #root {
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(23, 23, 19, 0.12);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 20px 70px rgba(28, 32, 20, 0.16);
      }

      .placeholder {
        display: grid;
        place-items: center;
        height: 100%;
        color: #77776f;
        font-size: 14px;
      }

      .preview-frame {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100%;
        min-height: 0;
        outline: none;
      }

      .preview-frame:focus-within {
        box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.22);
      }

      .canvas-scroller {
        position: relative;
        min-height: 0;
        overflow: auto;
      }

      .sheet-surface {
        min-width: 100%;
        min-height: 100%;
      }

      .sheet-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        z-index: 1;
      }

      .validation-menu {
        position: absolute;
        z-index: 3;
        min-width: 140px;
        max-width: 260px;
        border: 1px solid #94a3b8;
        border-radius: 8px;
        background: #fff;
        color: #171713;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
        font: 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 6px 8px;
      }

      .sheet-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        border-top: 1px solid rgba(23, 23, 19, 0.1);
        background: #f7f7f2;
        padding: 8px 10px;
      }

      .sheet-tabs button {
        background: #fff;
        color: #171713;
        padding: 6px 11px;
      }

      .sheet-tabs button.active {
        background: #171713;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div class="title">
          <strong>Portable Excel preview</strong>
          <span>Walnut WASM parses .xlsx in the browser, local source decodes proto and draws to canvas.</span>
        </div>
        <div class="actions">
          <span id="status" class="status">Idle</span>
          <button id="zoom-out" class="secondary" type="button" disabled>−</button>
          <span id="zoom-label" class="status">100%</span>
          <button id="zoom-in" class="secondary" type="button" disabled>+</button>
          <button id="formula-toggle" class="secondary" type="button" disabled>Show formulas</button>
          <select id="fixture-picker" class="fixture-picker" aria-label="Sample workbook">
            <option value="">Default calc sample</option>
            <option value="pivot-slicer-validation">Pivot/slicer validation</option>
            <option value="chart">Chart fixture</option>
            <option value="conditional-formatting">Conditional formatting</option>
            <option value="image">Image fixture</option>
            <option value="large">Large fixture</option>
          </select>
          <button id="load-sample" class="secondary" type="button">Load sample</button>
          <label class="file">
            Open .xlsx
            <input id="file-input" type="file" accept=".xlsx,.xlsm" />
          </label>
        </div>
      </header>
      <section id="root">
        <div class="placeholder">Load an .xlsx workbook to draw the portable canvas previewer.</div>
      </section>
    </main>
    <script type="module" src="/preview.mjs"></script>
  </body>
</html>
